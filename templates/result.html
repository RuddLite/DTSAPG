<!doctype html>
<title>Arbitration Packet Ready</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container py-5" style="max-width:640px;">
  <h3 class="mb-3">✅ Your arbitration packet is ready</h3>
  <p class="text-muted">Download the Preamble and Contentions documents below and attach both to your arbitration filing.</p>

  <div class="list-group mb-3">
    <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
       href="{{ url_for('download', token=token, which='top') }}">
      <span>📄 Preamble — {{ top_name }}</span>
      <span class="btn btn-sm btn-primary">Download</span>
    </a>
    <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
       href="{{ url_for('download', token=token, which='bottom') }}">
      <span>📄 Contentions — {{ bottom_name }}</span>
      <span class="btn btn-sm btn-primary">Download</span>
    </a>
  </div>

  <a href="{{ url_for('download', token=token, which='zip') }}" class="btn btn-outline-secondary btn-sm">Download both as .zip</a>
  <a href="{{ url_for('form') }}" class="btn btn-link btn-sm">Start a new packet</a>
</div>
